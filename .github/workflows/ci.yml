name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Build
        run: make
      - name: Check formatting (swiftformat lint if available)
        run: |
          if command -v swiftformat >/dev/null 2>&1; then swiftformat --lint .; else echo "swiftformat not installed, skipping"; fi
          if command -v swiftlint >/dev/null 2>&1; then swiftlint lint --strict; else echo "swiftlint not installed, skipping"; fi
          swiftc --version
      - name: Verify app bundle
        run: test -d build/Dictate.app && test -x build/Dictate.app/Contents/MacOS/Dictate && echo "bundle OK"
